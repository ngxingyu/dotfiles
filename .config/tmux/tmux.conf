# TMUX team-standard
set -g status-bg colour235
set -g status-fg colour136

unbind C-b
set-option -g prefix C-w
bind C-w send-prefix
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

setw -g mode-keys vi
set -g mouse on
set -g history-file ~/.tmux_history
setw -g aggressive-resize on
set -g status-right "#(tmux list-panes -F '#{pane_id}: #{pane_title}')"
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W"
set -g pane-border-status top
set -g pane-border-format "#{pane_index} #T"

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# --- session persistence (tpm + resurrect + continuum) ---
# tpm auto-detects an XDG setup by checking whether ~/.config/tmux/tmux.conf
# exists as a literal file -- it doesn't here (only .tmux.conf is symlinked;
# the real file lives at ~/.dotfiles/.config/tmux/tmux.conf), so tpm falls
# back to ~/.tmux/plugins/ and silently never finds/sources any plugin here.
# Override explicitly instead of depending on that heuristic.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Sessions listed here (space-separated exact names) are stripped out of
# every save, so they're never restored even while still running:
#   tmux set -g @resurrect-exclude-sessions "scratch some-other-name"
set -g @resurrect-exclude-sessions ""
set -g @resurrect-hook-post-save-layout '~/.dotfiles/.config/tmux/resurrect-exclude.sh'

# One-off: kill the current session and immediately re-save, so it can't
# come back from a stale snapshot (a dead session is already excluded from
# any FUTURE save -- resurrect can only capture what's currently running --
# but the last snapshot on disk still has it until something re-saves).
bind X confirm-before -p "kill session #{session_name} and purge it from the resurrect snapshot? (y/n)" \
  "run-shell 'tmux kill-session -t \"#{session_name}\"; ~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet'"

# keep this at the very bottom -- tpm requirement
run '~/.config/tmux/plugins/tpm/tpm'
